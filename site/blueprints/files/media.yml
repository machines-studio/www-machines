title: Média
accept:
  mime: image/*, video/*
  type: image, video

fields:
  caption:
    label: field.blocks.image.caption
    type: writer
    icon: text
    inline: true

  alt:
    label: field.blocks.image.alt
    type: text
    icon: title

  headline:
    label: Slideshow

  croppable:
    translate: false
    label: field.blocks.image.crop
    type: toggle
    width: 1/4
    default: on

  mobile_invert:
    translate: false
    label: Inverser en portrait (mobile)
    type: toggle
    width: 1/4
    default: off

  color:
    translate: false
    label: Couleur d’arrière-plan
    extends: fields/color
    width: 1/4

  rounded:
    translate: false
    label: Bords arrondis
    type: toggle
    default: off
    width: 1/4

