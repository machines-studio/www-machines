title: Projet
icon: box
extends:
  - presets/tabs
  - presets/icon

image:
  query: page.thumbnail.toFile
  cover: true

tabs:
  content:
    columns:
      - width: 1/3
        fields:
          thumbnail: fields/thumbnail

          hasChrome:
            label: Vignette fenêtrée
            type: toggle
            translate: false
            default: off

          year: fields/year
          tags: fields/tags
          credits: fields/credits

      - width: 2/3
        fields:
          slideshow:
            translate: false
            extends: fields/gallery
          blocks: fields/blocks

